[workspace]
resolver = "2"
members = ["card_ir", "engine", "py", "worker"]
# `cargo test` / `cargo build` at the root skip the PyO3 module `py` (built by tools/build_py.sh) and the
# native worker `worker` (mtgz-worker, ONNX Runtime: `cargo build --release -p mtgz_worker`, ENGINE.md 114)
default-members = ["card_ir", "engine"]
# the pinned zero-core (git submodule) has its own workspace: its crates are path dependencies here
exclude = ["third_party"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# line tables only (docs/ENGINE.md 165): file:line in backtraces and panics, without the variable and type info that
# made every link write a large PDB; codegen is the same (the digests are equal)
debug = "line-tables-only"
# A panic unwinds (Rust's default, said here so no one turns it off): self-play's driver catches one game's panic at the
# game's step and drops that game instead of the run (docs/ENGINE.md 172; zero-core docs/search.md 2.18) - the farm
# worker, the Python module and the tests alike. `panic = "abort"` would make every engine bug kill the whole process.
panic = "unwind"

# The fuzz farm's build (docs/ENGINE.md 70, tools/fuzz_farm.py): release speed with
# debug_assertions and overflow checks turned back on, so `debug_assert!`-style invariant checks
# and arithmetic overflow panic there instead of wrapping silently - the fuzz tests already run a
# sampled determinize check (engine/tests/fuzz.rs `check_determinize`, module docs); under this
# profile (`cfg!(debug_assertions)`) it samples far more often, since the profile's whole point is
# paying for cheap extra checking while fuzzing. `cargo test --profile fuzz -p engine --test fuzz`.
[profile.fuzz]
inherits = "release"
debug-assertions = true
overflow-checks = true
