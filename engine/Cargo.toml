[package]
name = "engine"
version = "0.1.0"
edition.workspace = true
description = "MTG Zero rules engine (docs/ENGINE.md) and its AlphaZero layer (the zero-core game `mtg`)"

# The integration tests (docs/ENGINE.md 165): a few binaries instead of one per file - every one links the whole
# engine, ~169 links a build before. The named ones stay their own binaries (`--test az`, `--test fuzz`, ... in the
# gate, the tools and the docs; the benchmarks and digest_formats each set the process's global allocator); the rest
# are modules of four suites (`--test cards_suite cards_m7a::` runs one file's tests).
autotests = false

[dependencies]
card_ir = { path = "../card_ir" }
serde.workspace = true
serde_json.workspace = true
# the search crate of the pinned core (git submodule third_party/zero-core, docs/pinning.md there):
# the `SearchGame` trait the AZ layer (src/az) implements
zero_search = { path = "../third_party/zero-core/crates/search" }

[dev-dependencies]
# The allocator of the module (`py/Cargo.toml`, `py/src/lib.rs`) for the benchmark tests (`tests/perf.rs`,
# `tests/measure_delver.rs`, `tests/driver_bench.rs`, the driver digest in `tests/digest_formats.rs`): they measure
# what `mtgz._engine` runs, not the Windows heap, which makes allocation-heavy parts several times slower (ENGINE.md
# 145, 148).
mimalloc = { version = "0.1", default-features = false }

[[test]]
name = "az"
path = "tests/az.rs"

[[test]]
name = "dealt_decks"
path = "tests/dealt_decks.rs"

[[test]]
name = "digest"
path = "tests/digest.rs"

