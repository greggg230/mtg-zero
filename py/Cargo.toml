[package]
name = "mtgz_py"
version = "0.1.0"
edition = "2021"
description = "Python module mtgz._engine: zero-core's driver / trees / game objects for the toy and MTG"
publish = false

[lib]
name = "mtgz_py"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
zero_py = { path = "../third_party/zero-core/crates/py" }
zero_search = { path = "../third_party/zero-core/crates/search" }
engine = { path = "../engine" }
# The process-wide allocator of the module (the Windows heap is slow and erratic for the engine's
# small allocations: docs/ENGINE.md 17). Built from C by the cc crate (MSVC / clang).
mimalloc = { version = "0.1", default-features = false }
